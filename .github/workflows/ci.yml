name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint + typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: screens
          POSTGRES_PASSWORD: screens
          POSTGRES_DB: screens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (PGlite) with coverage
        run: npm run coverage -- --coverage.thresholds.lines=85
      - name: Tests (Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql://screens:screens@localhost:5432/screens
        run: npx vitest run --no-file-parallelism
      - run: npm run build

  web:
    name: Web (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set +e
          docker build --progress=plain -t ad-screens . > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            msg=$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build failed::$msg"
          fi
          exit $status
      - name: Container serves the app and fails closed without secrets
        run: |
          docker run -d -p 8000:8000 -e SEED_EXAMPLE_SCREENS=true --name app ad-screens
          ok=0
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && ok=1 && break; sleep 1; done
          docker logs app
          [ "$ok" = 1 ]
          curl -sf localhost:8000/admin | grep -q '<div id="root">'
          curl -sf localhost:8000/api/config | grep -q '"payments_enabled":false'
          curl -sf localhost:8000/api/screens | grep -q 'Fade Room'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F business_name=x localhost:8000/api/campaigns)
          [ "$code" = 503 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"password":""}' localhost:8000/api/admin/login)
          [ "$code" = 503 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' localhost:8000/api/stripe/webhook)
          [ "$code" = 503 ]
